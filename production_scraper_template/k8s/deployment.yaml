apiVersion: apps/v1
kind: Deployment
metadata:
  name: scraper-workers
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scraper
  template:
    metadata:
      labels:
        app: scraper
    spec:
      containers:
        - name: scraper
          image: <YOUR_REGISTRY>/production_scraper:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: scraper-secrets
                  key: REDIS_URL
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: scraper-secrets
                  key: SUPABASE_URL
            - name: SUPABASE_KEY
              valueFrom:
                secretKeyRef:
                  name: scraper-secrets
                  key: SUPABASE_KEY
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          readinessProbe:
            exec:
              command: ["/bin/sh","-c","pgrep -f scrapy || exit 1"]
            initialDelaySeconds: 10
            periodSeconds: 15
