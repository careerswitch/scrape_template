name: CI
on: [push]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout @v3
      - name: Set up Python
        uses: actions/setup-python @.venv/lib/python3.11/site-packages/numpy/distutils/checks/cpu_neon_vfpv4.c
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest -q
      - name: Build docker image
        run: docker build -t production_scraper:ci .
