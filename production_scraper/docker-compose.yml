version: '3.8'
services:
  redis:
    image: redis:6.2
    ports:
      - "6379:6379"
  scraper:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    depends_on:
      - redis
    command: scrapy crawl robust
